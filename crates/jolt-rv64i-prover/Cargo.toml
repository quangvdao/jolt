[package]
name = "jolt-rv64i-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binary-field RV64I prover protocol"

[lints]
workspace = true

[features]
default = []
allocative = ["dep:allocative", "jolt-rv64i-verifier/allocative", "jolt-kernels/allocative", "jolt-verifier/allocative"]
parallel = ["jolt-kernels/parallel", "jolt-sumcheck/parallel"]
test-utils = ["jolt-rv64i-verifier/test-utils", "dep:rand"]

[dependencies]
allocative = { workspace = true, optional = true }
blake2.workspace = true
common.workspace = true
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field = { path = "../jolt-field", default-features = false, features = ["binary"] }
jolt-poly.workspace = true
jolt-r1cs.workspace = true
jolt-rv64i-arith.workspace = true
jolt-rv64i-kernels = { path = "../jolt-rv64i-kernels" }
rayon.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript = { workspace = true, features = ["transcript-blake2b"] }
thiserror.workspace = true
jolt-kernels.workspace = true
jolt-prover.workspace = true
jolt-verifier.workspace = true
tracing.workspace = true
jolt-rv64i-verifier.workspace = true
rand = { workspace = true, optional = true, features = ["std", "std_rng"] }

[dev-dependencies]
jolt-rv64i-trace.workspace = true
jolt-program = { workspace = true, features = ["image"] }
jolt-riscv.workspace = true

[[test]]
name = "bits_reduction"
required-features = ["test-utils"]

[[test]]
name = "wire"
required-features = ["test-utils"]

[[test]]
name = "witness"
required-features = ["test-utils"]

[[test]]
name = "spartan"
required-features = ["test-utils"]

[[test]]
name = "routers"
required-features = ["test-utils"]

[[test]]
name = "read_checking"
required-features = ["test-utils"]

[[test]]
name = "val_evaluation"
required-features = ["test-utils"]

[[test]]
name = "bytecode"
required-features = ["test-utils"]

[[test]]
name = "e2e"
required-features = ["test-utils"]

[[test]]
name = "tamper"
required-features = ["test-utils"]

[[test]]
name = "claim_flow"
required-features = ["test-utils"]

[[test]]
name = "schedule"
required-features = ["test-utils"]

[[test]]
name = "lifecycle"
required-features = ["test-utils"]

[[bench]]
name = "adapters"
harness = false
required-features = ["test-utils"]

[[test]]
name = "optimized_sources"
required-features = ["test-utils"]

[[test]]
name = "optimized_outer"
required-features = ["test-utils"]

[[test]]
name = "optimized_routers"
required-features = ["test-utils"]

[[test]]
name = "optimized_tail"
required-features = ["test-utils"]

[[test]]
name = "optimized_registry"
required-features = ["test-utils"]

[[bench]]
name = "witness_pipeline"
harness = false
required-features = ["test-utils"]
