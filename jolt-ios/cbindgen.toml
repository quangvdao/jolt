language = "C"
include_guard = "JOLT_IOS_H"
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Don't modify directly. */"
include_version = true
namespace = "jolt"
cpp_compat = true
style = "both"

[export]
include = [
    "JoltStatusCode",
    "JoltProofResult",
    "JoltVerifyResult",
    "JoltTranscriptFlavor",
]

[export.rename]
"JoltStatusCode" = "jolt_status_code"
"JoltProofResult" = "jolt_proof_result"
"JoltVerifyResult" = "jolt_verify_result"

[enum]
rename_variants = "ScreamingSnakeCase"

[defines]
"target_os = ios" = "JOLT_IOS"

[parse]
parse_deps = false
include = ["jolt-ios"]

