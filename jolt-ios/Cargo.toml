[package]
name = "jolt-ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
jolt-core = { path = "../jolt-core", default-features = false, features = ["prover"] }
ark-serialize = "0.5.0"
ark-bn254.workspace = true
common = { path = "../common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
