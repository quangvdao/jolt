[package]
name = "transpiler"
version = "0.1.0"
edition = "2021"
description = "Transpiles Jolt verifier stages to circuit code for various proving backends"

[dependencies]
ark-std.workspace = true
ark-bn254.workspace = true
ark-serialize.workspace = true
ark-ff.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }

rand_core.workspace = true
jolt-core = { path = "../jolt-core" }
jolt-crypto = { path = "../crates/jolt-crypto" }
jolt-dory = { path = "../crates/jolt-dory" }
jolt-field = { path = "../crates/jolt-field" }
jolt-openings = { path = "../crates/jolt-openings" }
jolt-transcript = { path = "../crates/jolt-transcript" }
zklean-extractor = { path = "../zklean-extractor" }
common = { path = "../common" }
light-poseidon = "0.4.0"
num-bigint = "0.4"

[features]
default = []
# Transcript features - must match proof generation
# Only one can be enabled at a time (enforced by jolt-core)
transcript-poseidon = ["jolt-core/transcript-poseidon"]
transcript-keccak = ["jolt-core/transcript-keccak"]
transcript-blake2b = ["jolt-core/transcript-blake2b"]
zk = ["jolt-core/zk"]

[[bin]]
name = "transpiler"
path = "src/main.rs"

[[bin]]
name = "compute_r_inv"
path = "src/bin/compute_r_inv.rs"
